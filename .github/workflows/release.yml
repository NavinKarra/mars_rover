name: Publish Customer Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: mars-rover-linux-x86_64
            architecture: x86_64
          - runner: macos-14
            asset: mars-rover-darwin-arm64
            architecture: arm64
          - runner: macos-15-intel
            asset: mars-rover-darwin-x86_64
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Runner Architecture
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: test "$(uname -m)" = "$EXPECTED_ARCHITECTURE"

      - name: Configure
        run: cmake -S . -B release-build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build release-build --config Release --parallel 2

      - name: Test
        run: |
          ./release-build/c___skeleton_test
          sh test/launcher_test.sh

      - name: Prepare Release Assets
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          mkdir -p dist
          cp release-build/c___skeleton "dist/$ASSET"
          cd dist
          cmake -E sha256sum "$ASSET" > "$ASSET.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mars-rover-*
          merge-multiple: true
          path: dist

      - name: Publish Complete Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > release-state; then
            test "$(cat release-state)" = true || {
              printf '%s\n' 'Refusing to overwrite an already published release.' >&2
              exit 1
            }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest