name: Publish Customer Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B release-build

      - name: Build
        run: cmake --build release-build --config Release --parallel 2

      - name: Test
        run: ./release-build/Release/c___skeleton_test.exe

      - name: Prepare Release Assets
        run: |
          mkdir -p dist
          cp release-build/Release/c___skeleton.exe dist/mars-rover-windows-x86_64.exe
          cd dist
          cmake -E sha256sum mars-rover-windows-x86_64.exe > mars-rover-windows-x86_64.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: mars-rover-windows-x86_64
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build-windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mars-rover-*
          merge-multiple: true
          path: dist

      - name: Publish Complete Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > release-state; then
            test "$(cat release-state)" = true || {
              printf '%s\n' 'Refusing to overwrite an already published release.' >&2
              exit 1
            }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest